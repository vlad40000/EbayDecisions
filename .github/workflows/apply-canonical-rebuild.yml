name: Apply canonical rebuild

on:
  push:
    branches: [canonical-rebuild]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical patch
        run: |
          git apply --index canonical-rebuild.patch
          git rm canonical-rebuild.patch
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild market semantics and Neon write model"
          git push origin HEAD:canonical-rebuild
